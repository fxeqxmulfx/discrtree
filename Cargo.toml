[package]
name = "discrtree"
version = "0.65.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Find Lean declarations by shape and lift them into a proof"
repository = "https://github.com/fxeqxmulfx/discrtree"
keywords = ["lean", "lean4", "mathlib", "search", "proof"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
# Not the defaults: 0.40 adds `ffi-sqlite-wasm-rs`, which puts wasm-only crates
# into Cargo.lock. `cache` is the other default, and `prepare_cached` needs it.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
